buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:9.3.1"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/NitroPlayer+autolinking.gradle'
apply from: "./fix-prefab.gradle"

apply plugin: "com.facebook.react"

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["NitroPlayer_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["NitroPlayer_" + name]).toInteger()
}

android {
  namespace "com.margelo.nitro.nitroplayer"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    // Keep the Cast OptionsProvider (referenced reflectively from the manifest) under R8.
    consumerProguardFiles "consumer-rules.pro"

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
            "META-INF",
            "META-INF/**",
            "**/libc++_shared.so",
            "**/libNitroModules.so",
            "**/libfbjni.so",
            "**/libjsi.so",
            "**/libfolly_json.so",
            "**/libfolly_runtime.so",
            "**/libglog.so",
            "**/libhermes.so",
            "**/libhermes-executor-debug.so",
            "**/libhermes_executor.so",
            "**/libreactnative.so",
            "**/libreactnativejni.so",
            "**/libturbomodulejsijni.so",
            "**/libreact_nativemodule_core.so",
            "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += ["${project.buildDir}/generated/source/codegen/java"]
    }
  }
}

repositories {
  mavenCentral()
  google()
}


def media3_version = "1.9.0"
dependencies {
  // The React Native Gradle plugin supplies the version.
  implementation "com.facebook.react:react-android"

  // Add a dependency on NitroModules
  implementation project(":react-native-nitro-modules")

  implementation "androidx.media3:media3-exoplayer:$media3_version"
  implementation "androidx.media3:media3-exoplayer-hls:$media3_version" //for .m3u8
  implementation "androidx.media3:media3-exoplayer-dash:$media3_version"
  implementation "androidx.media3:media3-exoplayer-smoothstreaming:$media3_version"
  implementation "androidx.media3:media3-session:$media3_version"
  implementation "androidx.media3:media3-common:$media3_version"
  implementation "androidx.media:media:1.7.0"

  // Google Cast: CastPlayer (drop-in Media3 Player), the Cast framework and the
  // MediaRouter chooser/controller dialogs used by Cast.showCastPicker().
  implementation "androidx.media3:media3-cast:$media3_version"
  implementation "com.google.android.gms:play-services-cast-framework:21.5.0"
  implementation "androidx.mediarouter:mediarouter:1.7.0"

  // WorkManager for background downloads.
  // 2.10.x crashes R8-minified release builds on AGP 9: R8 strips the WorkDatabase_Impl constructor.
  implementation "androidx.work:work-runtime-ktx:2.12.0"
}

