name: Harness iOS

concurrency:
  group: harness-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: "iOS Simulator device model"
        required: false
        default: "iPhone 18 Pro"
        type: string
      ios_version:
        description: "iOS version"
        required: false
        default: "27.0"
        type: string
      xcode_version:
        description: "Xcode version"
        required: false
        default: "27.1"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/harness-ios.yml"
      - "example/ios/**"
      - "example/__tests__/**"
      - "example/rn-harness.config.mjs"
      - "example/jest.harness.config.mjs"
      - "react-native-nitro-player/ios/**"
      - "react-native-nitro-player/src/**"
      - "react-native-nitro-player/nitrogen/**"
      - "**/Package.swift"
      - "**/*.podspec"
      - "**/bun.lock"
      - "**/react-native.config.js"
  pull_request:
    paths:
      - ".github/workflows/harness-ios.yml"
      - "example/ios/**"
      - "example/__tests__/**"
      - "example/rn-harness.config.mjs"
      - "example/jest.harness.config.mjs"
      - "react-native-nitro-player/ios/**"
      - "react-native-nitro-player/src/**"
      - "react-native-nitro-player/nitrogen/**"
      - "**/Package.swift"
      - "**/*.podspec"
      - "**/bun.lock"
      - "**/react-native.config.js"

env:
  DEVICE_MODEL: ${{ github.event.inputs.device_model || 'iPhone 18 Pro' }}
  IOS_VERSION: ${{ github.event.inputs.ios_version || '27.0' }}
  # Nitro v1 needs Swift 6.4, which ships with Xcode 27.
  XCODE_VERSION: ${{ github.event.inputs.xcode_version || '27.1' }}
  DEVELOPER_DIR: /Applications/Xcode_${{ github.event.inputs.xcode_version || '27.1' }}.app/Contents/Developer

jobs:
  harness_ios:
    name: Harness iOS
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies
        run: bun install

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer"
          xcodebuild -version

      - name: Resolve Swift packages
        working-directory: example
        run: npx react-native spm update --yes

      - name: Build iOS app
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild \
            -derivedDataPath build/DerivedData \
            -project example.xcodeproj \
            -scheme example \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=${{ env.DEVICE_MODEL }}' \
            -showBuildTimingSummary \
            ONLY_ACTIVE_ARCH=YES \
            build \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Setup iOS Simulator
        uses: futureware-tech/simulator-action@v5
        with:
          model: ${{ env.DEVICE_MODEL }}
          os: iOS
          os_version: ${{ env.IOS_VERSION }}
          wait_for_boot: true
          erase_before_boot: false

      - name: Install and warm up the app
        run: |
          xcrun simctl install booted example/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/example.app
          xcrun simctl launch booted org.reactjs.native.example.example
          sleep 20
          xcrun simctl terminate booted org.reactjs.native.example.example || true

      - name: Run Harness E2E tests
        working-directory: example
        env:
          HARNESS_IOS_DEVICE: ${{ env.DEVICE_MODEL }}
          HARNESS_IOS_VERSION: ${{ env.IOS_VERSION }}
        run: |
          # The harness client connects to the bridge once, with no retry: if that single
          # WebSocket connect loses a race after an app restart, the suite waits out the
          # whole bridgeTimeout and reports nothing. Retry the run rather than the flake.
          for attempt in 1 2; do
            if bun run test:harness --harnessRunner ios; then exit 0; fi
            echo "::warning::harness attempt $attempt failed, retrying"
            xcrun simctl terminate booted org.reactjs.native.example.example || true
            sleep 10
          done
          exit 1
