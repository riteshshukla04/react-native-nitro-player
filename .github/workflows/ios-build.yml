name: iOS Build

on:
  push:
    branches: [main,V2]
  pull_request:
    branches: [main,V2]
    paths:
      - 'react-native-nitro-player/ios/**'
      - 'example/ios/**'
      - 'bun.lock'
      - 'react-native-nitro-player/Package.swift'
      - 'react-native-nitro-player/nitrogen/**'
  workflow_dispatch:

jobs:
  build:
    # Nitro v1 needs Swift 6.4, which ships with Xcode 27.
    runs-on: xcode-27

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version

      - name: Resolve Swift packages
        working-directory: example
        run: npx react-native spm update --yes

      - name: Build iOS
        working-directory: example/ios
        run: |
          xcodebuild build \
            -project example.xcodeproj \
            -scheme example \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
