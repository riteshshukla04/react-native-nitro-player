name: Harness Tests

on:
  push:
    branches: [main, V2]
  pull_request:
    branches: [main, V2]
  workflow_dispatch:

# A newer push to the same PR makes an in-flight run pointless.
concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS harness
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Install CocoaPods
        working-directory: example/ios
        run: |
          bundle install
          RCT_USE_RN_DEP=1 RCT_USE_PREBUILT_RNCORE=1 bundle exec pod install

      # The runner image decides which iPhone/runtime exists, so pick one at run time
      # and hand it to rn-harness.config.mjs instead of pinning a version in the repo.
      # The runner image decides which iPhone/runtime exists, so pick one at run time
      # and hand it to rn-harness.config.mjs instead of pinning a version in the repo.
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          SELECTED=$(xcrun simctl list devices available --json | jq -r '
            .devices
            | to_entries
            | map(select(.key | test("iOS")))
            | map(
                (.key | capture("iOS-(?<v>[0-9-]+)").v | gsub("-"; ".")) as $version
                | .value
                | map(select(.isAvailable and (.name | startswith("iPhone"))))
                | map({udid, name, version: $version})
              )
            | flatten
            | sort_by(.version)
            | last
            | "\(.udid)\t\(.name)\t\(.version)"
          ')
          echo "udid=$(echo "$SELECTED" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$SELECTED" | cut -f2)" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$SELECTED" | cut -f3)" >> "$GITHUB_OUTPUT"
          echo "Using $(echo "$SELECTED" | cut -f2) on iOS $(echo "$SELECTED" | cut -f3)"

      - name: Build example app
        working-directory: example/ios
        run: |
          xcodebuild build \
            -workspace example.xcworkspace \
            -scheme example \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            | tail -20

      # The harness attaches to an already-installed app; it never builds or installs one.
      # The first launch after install also has to happen before the harness connects,
      # otherwise the run hangs until the bridge timeout with zero tests.
      - name: Install and warm up the app
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          APP=$(find ~/Library/Developer/Xcode/DerivedData/example-*/Build/Products/Debug-iphonesimulator \
            -maxdepth 1 -name 'example.app' | head -1)
          echo "Installing $APP"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" org.reactjs.native.example.example
          sleep 10
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" org.reactjs.native.example.example || true

      - name: Run harness suites
        working-directory: example
        env:
          HARNESS_IOS_DEVICE: ${{ steps.sim.outputs.name }}
          HARNESS_IOS_VERSION: ${{ steps.sim.outputs.version }}
        run: |
          set -o pipefail
          failed=0
          for suite in Playlist TrackPlayer Equalizer Platform DownloadManager; do
            echo "::group::$suite"
            xcrun simctl terminate "${{ steps.sim.outputs.udid }}" org.reactjs.native.example.example || true
            sleep 3
            ../node_modules/.bin/harness -c jest.harness.config.mjs "${suite}.harness" || failed=1
            echo "::endgroup::"
          done
          exit $failed
